name: Unity Android APK

# Needs GitHub secrets UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD
# (Unity Personal license XML from the Hub, plus the account that generated it).
on:
  push:
    paths:
      - "game/**"
      - ".github/workflows/unity-android.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Lumina Vale APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: game
          unityVersion: 6000.0.47f1
          targetPlatform: Android
          buildsPath: Builds
          buildName: LuminaVale
          allowDirtyBuild: true
          customMethod: LuminaVale.EditorTools.LuminaSetup.BuildAndroid

      - uses: actions/upload-artifact@v4
        with:
          name: LuminaVale-apk
          path: game/Builds/*.apk
